name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FNPACK_VERSION: "1.2.3"
  FNPACK_LINUX_AMD64_SHA256: "54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Prepare release notes
        shell: bash
        run: |
          runtime_tag="$(python -c 'from scripts.angemedia_gateway.version import __version__; print(__version__)')"
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || [[ "${GITHUB_REF_NAME%%-*}" != "$runtime_tag" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match runtime version $runtime_tag"
            exit 1
          fi
          heading="## [$runtime_tag]"
          notes="$RUNNER_TEMP/angemedia-release-notes.md"
          awk -v heading="$heading" '
            $0 == heading || index($0, heading " ") == 1 { section = 1; next }
            /^## \[/ && section { exit }
            section { print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "Release notes missing for $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Repository hygiene
        run: |
          forbidden="$(
            {
              find . -maxdepth 1 \( -name 'AUDIT*.md' -o -name 'HANDOFF*.md' -o -name '*Release-Report*.md' -o -name 'DEVELOPMENT.md' -o -name 'design-qa.md' \) -print
              find ./docs/assistant -maxdepth 1 -name 'EXECUTION_PLAN.md' -print 2>/dev/null
            }
          )"
          if [ -n "$forbidden" ]; then
            echo "Forbidden development documents found:"
            echo "$forbidden"
            exit 1
          fi

      - name: Syntax and tests
        run: |
          python -m compileall scripts tests
          mapfile -t js_files < <(find app/www/assets -type f -name '*.js' | sort)
          if ((${#js_files[@]} == 0)); then
            echo "No JavaScript files found for syntax check"
            exit 0
          fi
          for f in "${js_files[@]}"; do
            node --check "$f"
          done
          python -m unittest discover -s tests -v
          python -m unittest discover -s tools/agent_lab -p 'test_*.py' -v

      - name: Package gateway and skill
        run: |
          gateway="angemedia-gateway-${GITHUB_REF_NAME}.tar.gz"
          skill="angemedia-skill-${GITHUB_REF_NAME}.tar.gz"
          # 只打包发布提交，验收生成的缓存和临时数据不会进入制品。
          git archive --format=tar.gz --output="$gateway" "$GITHUB_SHA"

          if tar tzf "$gateway" | grep -E '(^|/)(\.env|generated/|uploads/|output/|DEVELOPMENT\.md|AUDIT[^/]*\.md|HANDOFF[^/]*\.md|.*Release-Report.*\.md|design-qa\.md|docs/assistant/EXECUTION_PLAN\.md)$'; then
            echo "Gateway package contains forbidden release files"
            exit 1
          fi

          skill_stage="$(mktemp -d)"
          trap 'rm -rf -- "$skill_stage"' EXIT
          tar xzf "$gateway" -C "$skill_stage" --strip-components=1 skill
          tar czf "$skill" -C "$skill_stage" .
          ls -lh "$gateway" "$skill"

      - name: Install verified fnpack
        run: |
          curl --fail --location --silent --show-error --retry 3 "https://static2.fnnas.com/fnpack/fnpack-$FNPACK_VERSION-linux-amd64" --output "$RUNNER_TEMP/fnpack"
          printf '%s  %s\n' "$FNPACK_LINUX_AMD64_SHA256" "$RUNNER_TEMP/fnpack" | sha256sum --check
          chmod 755 "$RUNNER_TEMP/fnpack"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build fnOS/FYGO package
        run: |
          VERSION="$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')"
          python packaging/fnos/AngeMedia/build.py --output-dir dist/fnos --python "$(command -v python)" --version "$VERSION"
          (
            cd dist/fnos
            sha256sum --check "AngeMedia-v$VERSION-fnOS-all.fpk.sha256"
          )

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/angemedia-release-notes.md
          files: |
            angemedia-gateway-${{ github.ref_name }}.tar.gz
            angemedia-skill-${{ github.ref_name }}.tar.gz
            dist/fnos/*.fpk
            dist/fnos/*.fpk.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish_docker:
    needs: build
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/docker.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
