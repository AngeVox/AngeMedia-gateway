name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FNPACK_VERSION: "1.2.3"
  FNPACK_LINUX_AMD64_SHA256: "54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Repository hygiene
        run: |
          forbidden="$(
            {
              find . -maxdepth 1 \( -name 'AUDIT*.md' -o -name 'HANDOFF*.md' -o -name '*Release-Report*.md' -o -name 'DEVELOPMENT.md' -o -name 'design-qa.md' \) -print
              find ./docs/assistant -maxdepth 1 -name 'EXECUTION_PLAN.md' -print 2>/dev/null
            }
          )"
          if [ -n "$forbidden" ]; then
            echo "Forbidden development documents found:"
            echo "$forbidden"
            exit 1
          fi

      - name: Syntax and tests
        run: |
          python -m compileall scripts tests
          mapfile -t js_files < <(find app/www/assets -type f -name '*.js' | sort)
          if ((${#js_files[@]} == 0)); then
            echo "No JavaScript files found for syntax check"
            exit 0
          fi
          for f in "${js_files[@]}"; do
            node --check "$f"
          done
          python -m unittest discover -s tests -v

      - name: Package gateway
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "Packaging AngeMedia Gateway ${VERSION}"

          # Package full repo (gateway + skill + docs) to /tmp first
          cd "${GITHUB_WORKSPACE}"
          tar czf "/tmp/angemedia-gateway-${VERSION}.tar.gz" \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.pytest_cache' \
            --exclude='.ruff_cache' \
            --exclude='.mypy_cache' \
            --exclude='.venv' \
            --exclude='node_modules' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='*.pyo' \
            --exclude='*.log' \
            --exclude='AUDIT*.md' \
            --exclude='HANDOFF*.md' \
            --exclude='*Release-Report*.md' \
            --exclude='DEVELOPMENT.md' \
            --exclude='design-qa.md' \
            --exclude='docs/assistant/EXECUTION_PLAN.md' \
            --exclude='generated' \
            --exclude='uploads' \
            --exclude='output' \
            --exclude='*.zip' \
            --exclude='*.tar.gz' \
            --exclude='.DS_Store' \
            .
          cp "/tmp/angemedia-gateway-${VERSION}.tar.gz" "${GITHUB_WORKSPACE}/"

          if tar tzf "${GITHUB_WORKSPACE}/angemedia-gateway-${VERSION}.tar.gz" | grep -E '(^|/)(\.env|generated/|uploads/|output/|DEVELOPMENT\.md|AUDIT[^/]*\.md|HANDOFF[^/]*\.md|.*Release-Report.*\.md|design-qa\.md|docs/assistant/EXECUTION_PLAN\.md)$'; then
            echo "Gateway package contains forbidden release files"
            exit 1
          fi

          # Package skill only (docs for AI agent use)
          mkdir -p /tmp/skill-pkg
          cp skill/SKILL.md /tmp/skill-pkg/
          cp skill/README.md /tmp/skill-pkg/
          cp -r skill/docs /tmp/skill-pkg/
          cd /tmp/skill-pkg
          tar czf "${GITHUB_WORKSPACE}/angemedia-skill-${VERSION}.tar.gz" .

          echo "Packages created:"
          ls -lh "${GITHUB_WORKSPACE}"/angemedia-*.tar.gz

      - name: Install verified fnpack
        run: |
          curl --fail --location --silent --show-error --retry 3 "https://static2.fnnas.com/fnpack/fnpack-$FNPACK_VERSION-linux-amd64" --output "$RUNNER_TEMP/fnpack"
          printf '%s  %s\n' "$FNPACK_LINUX_AMD64_SHA256" "$RUNNER_TEMP/fnpack" | sha256sum --check
          chmod 755 "$RUNNER_TEMP/fnpack"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build fnOS/FYGO package
        run: |
          VERSION="$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')"
          python packaging/fnos/AngeMedia/build.py --output-dir dist/fnos --python "$(command -v python)" --version "$VERSION"
          (
            cd dist/fnos
            sha256sum --check "AngeMedia-v$VERSION-fnOS-all.fpk.sha256"
          )

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            angemedia-gateway-${{ github.ref_name }}.tar.gz
            angemedia-skill-${{ github.ref_name }}.tar.gz
            dist/fnos/*.fpk
            dist/fnos/*.fpk.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
